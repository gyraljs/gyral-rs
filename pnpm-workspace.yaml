allowBuilds:
  esbuild: true

# Adopt a version only once it is two weeks old (Gyral's ADR 0032, docs/security.md).
minimumReleaseAge: 20160

# The owner approved and verified Gyral 0.3.9, published on 2026-10-30, so its two
# exact versions are exempt until 2026-11-13, when they turn two weeks old; the next
# dependency update after that removes them. The age gate still holds every other
# package and every later Gyral release.
minimumReleaseAgeExclude:
  - '@gyral/core@0.3.9'
  - '@gyral/ssr@0.3.9'
