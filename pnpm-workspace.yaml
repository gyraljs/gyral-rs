allowBuilds:
  esbuild: true

# Adopt a version only once it is two weeks old (Gyral's ADR 0032, docs/security.md).
minimumReleaseAge: 20160

# The owner-approved release was verified before this dependency refresh.
# Keep pnpm's age gate for every other package and future Gyral release.
minimumReleaseAgeExclude:
  - '@gyral/core@0.3.7'
  - '@gyral/ssr@0.3.7'
