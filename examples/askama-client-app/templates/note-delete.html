{% extends "base.html" %}
{% block content %}
<section class="panel delete-confirmation">
  <h1>Delete this note?</h1><p><bdi>{{ note.content.title.as_str() }}</bdi> will be removed from this notebook. This cannot be undone.</p>
  <form method="post" action="/notes/{{ note.id.value() }}/delete">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="actions"><button class="danger" type="submit">Delete note</button><a href="/notes/{{ note.id.value() }}">Keep note</a></div>
  </form>
</section>
{% endblock %}
