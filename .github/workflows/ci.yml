name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: corepack enable && corepack prepare pnpm@10.33.2 --activate
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo install cargo-nextest --version 0.9.143 --locked && cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo install sqlx-cli --version 0.8.3 --locked --no-default-features --features sqlite
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium webkit
      - run: make ci
      - run: make client-docker-smoke
      - run: make release-evidence
      - run: make load
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gyral-rs-linux-x86_64-evidence
          path: |
            .local/release/
            .local/load-evidence.json
          if-no-files-found: error
