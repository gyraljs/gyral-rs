name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: corepack enable
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo install cargo-nextest --version 0.9.148 --locked && cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features sqlite
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium webkit
      - run: make ci
      - run: make client-docker-smoke
      - run: make release-evidence
      - run: make load
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gyral-rs-linux-x86_64-evidence
          path: |
            .local/release/
            .local/load-evidence.json
          if-no-files-found: error
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: package-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      # Publish dry-run in dependency order, package content bounds, and an offline docs.rs build.
      - run: make package
