version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      embedded-runtime:
        patterns:
          - deno_core
          - deno_v8
          - deno_ops
          - serde_v8
          - v8
      rustcrypto:
        patterns:
          - hmac
          - sha2
      serde:
        patterns:
          - serde
          - serde_derive
          - serde_json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gyral:
        patterns:
          - "@gyral/*"
