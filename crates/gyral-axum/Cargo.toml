[package]
name = "gyral-axum"
description = "Thin Axum response integration for gyral-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/gyral-axum"
keywords = ["gyral", "axum", "ssr", "web-components", "html"]
categories = ["web-programming::http-server"]
# Only the library source, its README, and the license reach the registry.
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[dependencies]
gyral-renderer.workspace = true
axum.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
tower.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
