[package]
name = "gyral"
description = "Server-render Gyral web components in Rust and hydrate them in the browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/gyral"
keywords = ["gyral", "ssr", "web-components", "hydration", "axum"]
categories = ["web-programming", "template-engine"]
# Only the library source, its README, and the license reach the registry.
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[features]
default = []
## Re-export the Axum response adapter as `gyral::axum`.
axum = ["dep:gyral-axum"]

[dependencies]
gyral-renderer.workspace = true
gyral-axum = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
