[package]
name = "gyral-renderer"
description = "Render Gyral app bundles inside Rust using deno_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/gyral-renderer"
keywords = ["gyral", "ssr", "deno-core", "v8", "web-components"]
categories = ["web-programming", "template-engine"]
# Only the library source, its README, and the license reach the registry.
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[dependencies]
sha2.workspace = true
gyral-renderer-domain.workspace = true
deno_core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
metrics.workspace = true

[dev-dependencies]
metrics-exporter-prometheus.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
