[package]
name = "gyral-renderer-domain"
description = "Pure rendering contract and validated types for gyral-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/gyral-renderer-domain"
keywords = ["gyral", "ssr", "web-components", "rendering", "validation"]
categories = ["web-programming", "template-engine"]
# Only the library source, its README, and the license reach the registry.
include = ["/src/**/*.rs", "/README.md", "/LICENSE"]

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
